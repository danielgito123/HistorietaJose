<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#120f14"><title>Las bendiciones de Jacob · Historieta</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100e14;color:#f7dc9e;font-family:system-ui,Segoe UI,sans-serif}body{display:flex;flex-direction:column}.top{height:45px;min-height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;gap:10px;background:#1b1419}.brand{font-weight:800;font-size:clamp(12px,2vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top button,.bottom button{border:1px solid #93744c;background:#2c2020;color:#ffdf9b;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}.reader{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:7px;perspective:1300px}.spread{height:100%;width:100%;display:flex;align-items:center;justify-content:center;gap:6px}.sheet{position:relative;min-width:0;height:100%;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#161219;border:3px solid #866039;border-radius:7px;box-shadow:0 12px 35px #0008}.sheet img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.sheet.empty{visibility:hidden}.sheet.turn{animation:flip .38s ease both}@keyframes flip{0%{transform:rotateY(0);opacity:1}50%{transform:rotateY(-12deg);opacity:.65}100%{transform:rotateY(0);opacity:1}}.bottom{height:51px;min-height:51px;display:flex;align-items:center;justify-content:center;gap:15px;background:#1b1419}.count{min-width:95px;text-align:center;font-weight:700}.hint{font-size:11px;opacity:.7}.sheet:after{content:'';position:absolute;bottom:0;right:0;border-style:solid;border-width:0 0 24px 24px;border-color:transparent transparent #b99258 transparent;filter:drop-shadow(-2px -2px 2px #0006);pointer-events:none}button:disabled{opacity:.3;cursor:default}@media(max-width:760px){.top{height:42px;min-height:42px}.reader{padding:4px}.spread{gap:0}.sheet{border-width:2px}.bottom{height:54px;min-height:54px;gap:8px}.hint{display:none}.bottom button{padding:9px 12px}.count{min-width:70px}}@media(max-height:440px){.top{height:32px;min-height:32px}.bottom{height:36px;min-height:36px}.bottom button{padding:4px 9px}}:fullscreen .reader{padding:2px} :fullscreen .top{height:34px;min-height:34px}

/* Visor móvil: la página determina la altura, sin espacios negros */
@media(max-width:760px){
 html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
 body{display:block;min-height:100dvh}
 .top{position:sticky;top:0;z-index:5;padding:0 9px}
 .top button{font-size:11px;padding:7px}
 .reader{display:block;min-height:0;padding:6px 5px 12px;perspective:none}
 .spread{display:block;width:100%;height:auto}
 .sheet{width:100%;height:auto;min-height:0;display:block;overflow:visible;border:2px solid #866039;border-radius:7px;background:#161219}
 .sheet img{width:100%;height:auto;max-width:none;max-height:none;object-fit:initial;vertical-align:middle}
 .sheet.empty{display:none}
 .bottom{position:sticky;bottom:0;z-index:5;min-height:54px;height:54px;gap:7px}
 .bottom button{padding:8px 9px}
 .count{min-width:66px}
 .sheet:after{border-width:0 0 17px 17px}
}
/* Ampliación de lectura */
#zoom{display:none;position:fixed;inset:0;z-index:50;background:#09080cf5;overflow:auto;touch-action:pan-x pan-y}
#zoom.open{display:block}
#zoom img{display:block;width:180%;max-width:none;height:auto;margin:55px 0 40px}
#closeZoom{position:fixed;top:12px;right:12px;z-index:51;border:1px solid #d6ae69;background:#302326;color:#ffe2a0;padding:10px 14px;border-radius:9px;font-weight:bold}
@media(min-width:761px){#zoom img{width:110%;margin:60px auto}}
</style></head><body><header class="top"><span class="brand">✦ LAS BENDICIONES DE JACOB</span><button id="full">⛶ Pantalla completa</button></header><main class="reader"><div class="spread" id="spread"><div class="sheet" id="a"><img alt="Página de historieta" id="ia"></div><div class="sheet" id="b"><img alt="Página de historieta" id="ib"></div></div></main><footer class="bottom"><button id="prev">❮ Anterior</button><span class="count" id="count"></span><button id="next">Siguiente ❯</button><span class="hint">← → teclado · desliza para cambiar</span></footer><div id="zoom" role="dialog" aria-label="Ampliar página"><button id="closeZoom" type="button">✕ Cerrar</button><img id="zoomImg" alt="Página ampliada"></div><script>
const total=32;let page=1;const a=document.querySelector('#a'),b=document.querySelector('#b'),ia=document.querySelector('#ia'),ib=document.querySelector('#ib');const mobile=()=>matchMedia('(max-width:760px)').matches;const src=n=>'imagenes/pagina_'+String(n).padStart(2,'0')+'.webp';function render(){let duo=!mobile(),start=duo?Math.floor((page-1)/2)*2+1:page;ia.src=src(start);a.classList.remove('empty');if(duo&&start+1<=total){ib.src=src(start+1);b.classList.remove('empty')}else{b.classList.add('empty');ib.removeAttribute('src')}document.querySelector('#count').textContent=duo?`${start}–${Math.min(start+1,total)} / ${total}`:`${page} / ${total}`;document.querySelector('#prev').disabled=start===1;document.querySelector('#next').disabled=(duo?start+1:page)>=total;location.hash='pagina-'+page}function go(dir){let step=mobile()?1:2;page=Math.max(1,Math.min(total,page+dir*step));if(!mobile())page=Math.floor((page-1)/2)*2+1;render();a.classList.remove('turn');void a.offsetWidth;a.classList.add('turn');if(mobile())window.scrollTo({top:0,behavior:'instant'})}document.querySelector('#prev').onclick=()=>go(-1);document.querySelector('#next').onclick=()=>go(1);document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});let touch=0;document.querySelector('#spread').addEventListener('touchstart',e=>touch=e.changedTouches[0].screenX,{passive:true});document.querySelector('#spread').addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-touch;if(Math.abs(d)>45)go(d<0?1:-1)},{passive:true});addEventListener('resize',()=>{const was=window._mobileState;const now=mobile();if(was!==now){window._mobileState=now;render()}});window._mobileState=mobile();
const zoom=document.querySelector('#zoom'),zoomImg=document.querySelector('#zoomImg');
ia.addEventListener('click',()=>{zoomImg.src=ia.src;zoom.classList.add('open');document.body.style.overflow='hidden'});
ib.addEventListener('click',()=>{if(ib.src){zoomImg.src=ib.src;zoom.classList.add('open');document.body.style.overflow='hidden'}});
function closeZoom(){zoom.classList.remove('open');document.body.style.overflow=''}
document.querySelector('#closeZoom').onclick=closeZoom;
zoom.addEventListener('click',e=>{if(e.target===zoom)closeZoom()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom()});
const found=location.hash.match(/pagina-(\d+)/);if(found)page=Math.max(1,Math.min(total,+found[1]));render();</script></body></html>
